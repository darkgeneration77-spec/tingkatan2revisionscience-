let active=[], wrong=[];
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(){
 let b=document.getElementById('filter').value,n=+document.getElementById('amount').value;
 let pool=b==='Semua'?all:all.filter(x=>x.bab===b);
 active=shuffle(pool).slice(0,Math.min(n,pool.length));wrong=[];
 render();document.getElementById('summary').classList.add('hidden');
}
function render(){
 document.getElementById('quiz').innerHTML=active.map((x,i)=>`<div class="question" id="box${i}">
 <div class="meta"><span class="tag">${x.bab}</span><span class="tag">${x.topic}</span></div>
 <strong>${i+1}. ${x.q}</strong>
 ${x.o.map((v,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"> ${v}</label>`).join('')}
 <div id="e${i}"></div></div>`).join('');
 document.getElementById('bar').style.width='0%';
}
function correction(x,sel){
 return `<div class="explain">
 <div class="step"><strong>Langkah 1 / 步骤1：</strong>Kenal pasti bab dan topik: ${x.bab} — ${x.topic}。</div>
 <div class="step"><strong>Langkah 2 / 步骤2：</strong>Cari kata kunci dalam soalan. Tentukan sama ada soalan meminta tokoh, tahun, tempat, tugas, sebab atau karya。<br>先判断题目问人物、年份、地点、职责、原因还是作品。</div>
 <div class="step"><strong>Langkah 3 / 步骤3：</strong>Jawapan murid: ${sel||'Tidak dijawab（未作答）'}。</div>
 <div class="step"><strong>Langkah 4 / 步骤4：</strong>${x.ex}</div>
 <div class="zh"><strong>华语解释：</strong>${x.zh}</div>
 <div class="mn"><strong>口诀 / Formula ingatan：</strong>${x.m}</div>
 <div class="step"><strong>检查法：</strong>Tutup jawapan dan jawab semula: “Soalan tanya apa? Fakta tepat apa?”<br>盖住答案，再说：“题目问什么？准确知识是什么？”</div>
 </div>`;
}
function check(){
 let score=0,stats={"Bab 5":[0,0],"Bab 6":[0,0]};wrong=[];
 active.forEach((x,i)=>{
  stats[x.bab][1]++;
  let p=document.querySelector(`input[name=q${i}]:checked`),e=document.getElementById(`e${i}`);
  let ok=p&&+p.value===x.a;
  if(ok){score++;stats[x.bab][0]++;e.innerHTML=`<p class="correct"><strong>Betul / 正确</strong> — ${x.ex}</p><div class="mn">${x.m}</div>`}
  else{wrong.push(x);e.innerHTML=`<p class="wrong"><strong>Salah / 错误</strong></p>${correction(x,p?x.o[+p.value]:'')}`}
 });
 let pct=Math.round(score/active.length*100),b5=stats["Bab 5"][1]?Math.round(stats["Bab 5"][0]/stats["Bab 5"][1]*100):null,b6=stats["Bab 6"][1]?Math.round(stats["Bab 6"][0]/stats["Bab 6"][1]*100):null;
 let pass=pct>=85&&(b5===null||b5>=80)&&(b6===null||b6>=80);
 let topics={};active.forEach((x,i)=>{let p=document.querySelector(`input[name=q${i}]:checked`),ok=p&&+p.value===x.a;topics[x.topic]??=[0,0];topics[x.topic][1]++;if(ok)topics[x.topic][0]++});
 let weak=Object.entries(topics).map(([k,v])=>[k,Math.round(v[0]/v[1]*100)]).filter(x=>x[1]<80).sort((a,b)=>a[1]-b[1]);
 let s=document.getElementById('summary');s.classList.remove('hidden');s.innerHTML=`<h2>${pass?'达到综合掌握标准':'尚未达到综合掌握标准'}</h2>
 <p><strong>总分：</strong>${score}/${active.length}（${pct}%）</p>
 <p>${b5===null?'':`Bab 5：${b5}%　`}${b6===null?'':`Bab 6：${b6}%`}</p>
 <h3>需要重温</h3><p>${weak.length?weak.map(x=>`${x[0]}（${x[1]}%）`).join('、'):'没有明显弱项'}</p>
 <p>${pass?'隔天再随机测试一次，确认长期记忆。':'阅读错题步骤和口诀后，点击“只做错题”。'}</p>`;
 document.getElementById('bar').style.width=pct+'%';s.scrollIntoView({behavior:'smooth'});
}
function retryWrong(){
 if(!wrong.length){alert('请先批改，系统才知道哪些是错题。');return}
 active=shuffle(wrong);wrong=[];render();window.scrollTo({top:0,behavior:'smooth'});
}
start();
</script></body></html>
