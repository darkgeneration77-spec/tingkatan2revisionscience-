<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bab 6 Revision</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,"Microsoft YaHei",sans-serif;background:#07111f}.nav{height:64px;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;background:#07111f;border-bottom:1px solid #315071;overflow-x:auto}.nav a,.music button{color:white;text-decoration:none;background:#294e7c;padding:9px 12px;border-radius:9px;font-weight:800;white-space:nowrap;border:0}.nav a:first-child{background:#f4c75a;color:#201706}.nav a.active{outline:2px solid #f4c75a}.music{display:flex;align-items:center;gap:6px}.music input{width:80px}iframe{width:100%;height:calc(100vh - 64px);border:0;background:white}@media(max-width:650px){.nav{justify-content:flex-start;height:62px}.nav a,.music button{padding:8px 9px;font-size:12px}.music input{width:55px}iframe{height:calc(100vh - 62px)}}</style></head><body><div class="nav"><a href="index.html">← 首页</a><a href="learn-bab5.html">Bab 5</a><a class="active" href="learn-bab6.html">Bab 6</a><a href="learn-practice.html">综合练习</a><div class="music"><button id="musicBtn" onclick="toggleMusic()">▶ BGM</button><input id="vol" type="range" min="0" max="100" value="38" aria-label="音量"></div></div><iframe src="bab6.html" title="Bab 6"></iframe><script>let ctx,gain,timer,playing=false,step=0;const notes=[261.63,329.63,392,523.25,392,329.63,293.66,349.23,440,587.33,440,349.23];function tone(f,d=.32){if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.13,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+d);o.connect(g);g.connect(gain);o.start();o.stop(ctx.currentTime+d+.03)}function loop(){tone(notes[step%notes.length]);if(step%4===0)tone(notes[(step+4)%notes.length]/2,.55);step++;timer=setTimeout(loop,430)}function startMusic(){if(playing)return;ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();gain=gain||ctx.createGain();if(!gain._linked){gain.connect(ctx.destination);gain._linked=true}gain.gain.value=(+vol.value/100)*.42;ctx.resume();playing=true;musicBtn.textContent='⏸ BGM';localStorage.setItem('sejBgm','on');loop()}function stopMusic(){playing=false;clearTimeout(timer);musicBtn.textContent='▶ BGM';localStorage.setItem('sejBgm','off')}function toggleMusic(){playing?stopMusic():startMusic()}vol.value=localStorage.getItem('sejVol')||38;vol.oninput=()=>{localStorage.setItem('sejVol',vol.value);if(gain)gain.gain.value=(+vol.value/100)*.42};document.addEventListener('pointerdown',()=>{if(localStorage.getItem('sejBgm')!=='off')startMusic()},{once:true});</script></body></html>
